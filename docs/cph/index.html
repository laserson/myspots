    onSearchChanged();
    searchInput.focus();
  });

  var divSearch = document.createElement('div');
  divSearch.className = 'section-divider';
  controlsEl.appendChild(divSearch);

  // --- Categories section ---
  var catSection = document.createElement('div');
  catSection.className = 'filter-section';
  var catLabel = document.createElement('span');
  catLabel.className = 'section-label';
  catLabel.textContent = 'Cat';
  catSection.appendChild(catLabel);

  // Primary category chips (always visible)
  primaryCats.forEach(function(cat) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = cat;
    chip.dataset.group = 'cat';
    chip.dataset.value = cat;
    chip.addEventListener('click', function() {
      if (activeCategories.has(cat)) { activeCategories.delete(cat); chip.classList.remove('active'); }
      else { activeCategories.add(cat); chip.classList.add('active'); }
      updateMoreChip();
      updateHash(); applyFilters(); updateResetBtn();
    });
    catSection.appendChild(chip);
  });

  // "More" dropdown for secondary categories
  if (secondaryCats.length > 0) {
    var moreWrap = document.createElement('div');
    moreWrap.className = 'more-wrap';
    var moreChip = document.createElement('div');
    moreChip.className = 'more-chip';
    moreChip.textContent = 'more';
    moreWrap.appendChild(moreChip);

    var moreDropdown = document.createElement('div');
    moreDropdown.className = 'more-dropdown';
    secondaryCats.forEach(function(cat) {
      var chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = cat;
      chip.dataset.group = 'cat';
      chip.dataset.value = cat;
      chip.addEventListener('click', function() {
        if (activeCategories.has(cat)) { activeCategories.delete(cat); chip.classList.remove('active'); }
        else { activeCategories.add(cat); chip.classList.add('active'); }
        updateMoreChip();
        updateHash(); applyFilters();
      });
      moreDropdown.appendChild(chip);
    });
    moreWrap.appendChild(moreDropdown);

    moreChip.addEventListener('click', function(e) {
      e.stopPropagation();
      moreDropdown.classList.toggle('open');
    });

    catSection.appendChild(moreWrap);
  }

  function updateMoreChip() {
    if (!moreChip) return;
    var count = 0;
    secondaryCats.forEach(function(c) { if (activeCategories.has(c)) count++; });
    moreChip.textContent = count > 0 ? 'more (' + count + ')' : 'more';
    moreChip.classList.toggle('has-active', count > 0);
  }

  controlsEl.appendChild(catSection);

  // Divider
  var div1 = document.createElement('div');
  div1.className = 'section-divider';
  controlsEl.appendChild(div1);

  // --- Flags section ---
  var flagSection = document.createElement('div');
  flagSection.className = 'filter-section';
  var flagLabel = document.createElement('span');
  flagLabel.className = 'section-label';
  flagLabel.textContent = 'Flags';
  flagSection.appendChild(flagLabel);
  flagNames.forEach(function(flag) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = flag;
    chip.dataset.group = 'flag';
    chip.dataset.value = flag;
    chip.addEventListener('click', function() {
      if (activeFlags.has(flag)) { activeFlags.delete(flag); chip.classList.remove('active'); }
      else { activeFlags.add(flag); chip.classList.add('active'); }
      updateHash(); applyFilters(); updateResetBtn();
    });
    flagSection.appendChild(chip);
  });
  controlsEl.appendChild(flagSection);

  // Divider
  var div2 = document.createElement('div');
  div2.className = 'section-divider';
  controlsEl.appendChild(div2);

  // --- Tags section ---
  var tagSection = document.createElement('div');
  tagSection.className = 'filter-section tags-section';
  var tagLabel = document.createElement('span');
  tagLabel.className = 'section-label';
  tagLabel.textContent = 'Tags';
  tagSection.appendChild(tagLabel);

  var tagChipsContainer = document.createElement('span');
  tagChipsContainer.style.cssText = 'display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;';
  tagSection.appendChild(tagChipsContainer);

  var tagInputWrap = document.createElement('div');
  tagInputWrap.className = 'tag-input-wrap';
  var tagInput = document.createElement('input');
  tagInput.className = 'tag-input';
  tagInput.type = 'text';
  tagInput.placeholder = 'search...';
  tagInputWrap.appendChild(tagInput);

  var tagDropdown = document.createElement('div');
  tagDropdown.className = 'tag-dropdown';
  tagInputWrap.appendChild(tagDropdown);
  tagSection.appendChild(tagInputWrap);
  controlsEl.appendChild(tagSection);

  // --- Reset button ---
  var resetBtn = document.createElement('div');
  resetBtn.className = 'reset-btn hidden';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', function() {
    activeCategories.clear();
    activeFlags.clear();
    activeTags.clear();
    searchInput.value = '';
    searchClear.classList.add('hidden');
    controlsEl.querySelectorAll('.chip.active').forEach(function(c) { c.classList.remove('active'); });
    updateMoreChip();
    renderTagChips();
    updateHash();
    applyFilters();
    updateResetBtn();
  });
  controlsEl.appendChild(resetBtn);

  function updateResetBtn() {
    var hasAny = activeCategories.size > 0 || activeFlags.size > 0 ||
                 activeTags.size > 0 || searchTerms().length > 0;
    resetBtn.classList.toggle('hidden', !hasAny);
  }

  // --- Result count (click to zoom to the matches) ---
  var countBtn = document.createElement('div');
  countBtn.className = 'count-btn hidden';
  countBtn.title = 'Zoom to results';
  countBtn.addEventListener('click', function() {
    if (lastMatches.length === 0) return;
    var bounds = new mapboxgl.LngLatBounds();
    lastMatches.forEach(function(e) { bounds.extend([e.place.lon, e.place.lat]); });
    map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
  });
  controlsEl.appendChild(countBtn);

  var highlightedIndex = -1;

  function renderTagDropdown() {
    var query = tagInput.value.toLowerCase().trim();
    tagDropdown.innerHTML = '';
    highlightedIndex = -1;
    if (!query) { tagDropdown.classList.remove('open'); return; }
    var matches = allTags.filter(function(t) {
      return t.toLowerCase().indexOf(query) !== -1 && !activeTags.has(t);
    }).slice(0, 15);
    if (matches.length === 0) { tagDropdown.classList.remove('open'); return; }
    matches.forEach(function(tag) {
      var opt = document.createElement('div');
      opt.className = 'tag-option';
      opt.textContent = tag;
      opt.addEventListener('mousedown', function(e) { e.preventDefault(); addTag(tag); });
      tagDropdown.appendChild(opt);
    });
    tagDropdown.classList.add('open');
  }

  function addTag(tag) {
    activeTags.add(tag);
    tagInput.value = '';
    tagDropdown.classList.remove('open');
    renderTagChips();
    updateHash();
    applyFilters();
    updateResetBtn();
  }

  function removeTag(tag) {
    activeTags.delete(tag);
    renderTagChips();
    updateHash();
    applyFilters();
    updateResetBtn();
  }

  function renderTagChips() {
    tagChipsContainer.innerHTML = '';
    activeTags.forEach(function(tag) {
      var chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = escHtml(tag) + ' <span class="remove">&times;</span>';
      chip.querySelector('.remove').addEventListener('click', function() { removeTag(tag); });
      tagChipsContainer.appendChild(chip);
    });
  }

  tagInput.addEventListener('input', renderTagDropdown);
  tagInput.addEventListener('focus', renderTagDropdown);
  tagInput.addEventListener('blur', function() {
    setTimeout(function() { tagDropdown.classList.remove('open'); }, 150);
  });
  tagInput.addEventListener('keydown', function(e) {
    var options = tagDropdown.querySelectorAll('.tag-option');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlightedIndex = Math.min(highlightedIndex + 1, options.length - 1);
      updateHighlight(options);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightedIndex = Math.max(highlightedIndex - 1, 0);
      updateHighlight(options);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (highlightedIndex >= 0 && options[highlightedIndex]) {
        addTag(options[highlightedIndex].textContent);
      }
    } else if (e.key === 'Escape') {
      tagDropdown.classList.remove('open');
      tagInput.blur();
    }
  });

  function updateHighlight(options) {
    for (var i = 0; i < options.length; i++) {
      options[i].classList.toggle('highlighted', i === highlightedIndex);
    }
    if (options[highlightedIndex]) {
      options[highlightedIndex].scrollIntoView({ block: 'nearest' });
    }
  }

  // Close "more" dropdown when clicking elsewhere
  document.addEventListener('click', function() {
    if (moreDropdown) moreDropdown.classList.remove('open');
  });

  // --- Hash parsing/updating ---
  function parseHash() {
    var hash = window.location.hash.replace('#', '');
    if (!hash) return;
    var pairs = hash.split('&');
    pairs.forEach(function(pair) {
      var eq = pair.indexOf('=');
      if (eq === -1) return;
      var key = pair.slice(0, eq);
      var raw = decodeURIComponent(pair.slice(eq + 1));
      var values = raw.split(',').filter(Boolean);
      if (key === 'q') {
        searchInput.value = raw;
        searchClear.classList.toggle('hidden', !raw);
      } else if (key === 'cats') {
        var catSlugs = DATA.root_categories.map(toSlug);
        values.forEach(function(slug) {
          var idx = catSlugs.indexOf(slug);
          if (idx !== -1) activeCategories.add(DATA.root_categories[idx]);
        });
      } else if (key === 'flags') {
        var flagSlugs = flagNames.map(toSlug);
        values.forEach(function(slug) {
          var idx = flagSlugs.indexOf(slug);
          if (idx !== -1) activeFlags.add(flagNames[idx]);
        });
      } else if (key === 'tags') {
        values.forEach(function(tag) {
          if (allTags.indexOf(tag) !== -1) activeTags.add(tag);
        });
      }
    });
    // Sync chip UI state
    controlsEl.querySelectorAll('.chip').forEach(function(chip) {
      if (chip.dataset.group === 'cat' && activeCategories.has(chip.dataset.value)) chip.classList.add('active');
      if (chip.dataset.group === 'flag' && activeFlags.has(chip.dataset.value)) chip.classList.add('active');
    });
    updateMoreChip();
    renderTagChips();
  }

  function updateHash() {
    var parts = [];
    if (activeCategories.size > 0) {
      var cats = [];
      activeCategories.forEach(function(c) { cats.push(toSlug(c)); });
      parts.push('cats=' + cats.join(','));
    }
    if (activeFlags.size > 0) {
      var flags = [];
      activeFlags.forEach(function(f) { flags.push(toSlug(f)); });
      parts.push('flags=' + flags.join(','));
    }
    if (activeTags.size > 0) {
      var tags = [];
      activeTags.forEach(function(t) { tags.push(encodeURIComponent(t)); });
      parts.push('tags=' + tags.join(','));
    }
    var query = searchInput.value.trim();
    if (query) {
      parts.push('q=' + encodeURIComponent(query));
    }
    if (parts.length > 0) {
      history.replaceState(null, '', '#' + parts.join('&'));
    } else {
      history.replaceState(null, '', window.location.pathname);
    }
  }

  // --- Filter logic ---
  // Categories: OR, Flags: AND, Tags: AND, search terms: AND, groups AND together
  var lastMatches = ENTRIES;

  function entryMatches(entry, terms) {
    var p = entry.place;
    var i;

    if (activeCategories.size > 0) {
      var catHit = false;
      for (i = 0; i < p.root_categories.length; i++) {
        if (activeCategories.has(p.root_categories[i])) { catHit = true; break; }
      }
      if (!catHit) return false;
    }

    var ok = true;
    activeFlags.forEach(function(f) { if (p.flags.indexOf(f) === -1) ok = false; });
    activeTags.forEach(function(t) { if (p.tags.indexOf(t) === -1) ok = false; });
    if (!ok) return false;

    for (i = 0; i < terms.length; i++) {
      if (entry.blob.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  function applyFilters() {
    var terms = searchTerms();
    var hasFilters = activeCategories.size > 0 || activeFlags.size > 0 ||
                     activeTags.size > 0 || terms.length > 0;
    if (hasFilters) {
      lastMatches = ENTRIES.filter(function(e) { return entryMatches(e, terms); });
    } else {
      lastMatches = ENTRIES;
    }
    var source = map.getSource('spots');
    if (source) source.setData(featureCollection(lastMatches));
    countBtn.classList.toggle('hidden', !hasFilters);
    countBtn.classList.toggle('empty', lastMatches.length === 0);
    countBtn.textContent = lastMatches.length === 1
      ? '1 spot' : lastMatches.length + ' spots';
  }

  function makePopupHTML(p) {
    var html = '<div class="popup-name">' + escHtml(p.name) + '</div>';
    if (p.address) html += '<div class="popup-address">' + escHtml(p.address) + '</div>';
    var meta = '';
    if (p.categories_str) meta += '<span>' + escHtml(p.categories_str) + '</span>';
    if (p.flags_str) meta += '<span>' + escHtml(p.flags_str) + '</span>';
    if (p.tags_str) meta += '<span>' + escHtml(p.tags_str) + '</span>';
    if (meta) html += '<div class="popup-meta">' + meta + '</div>';
    if (p.notes) html += '<div class="popup-notes">' + linkify(p.notes) + '</div>';
    var links = '';
    if (p.website) links += '<a href="' + escAttr(p.website) + '" target="_blank" rel="noopener">Website</a>';
    var gmapsQuery = encodeURIComponent(p.name + (p.address ? ' ' + p.address : ''));
    var gmapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + gmapsQuery;
    if (links) links += ' &middot; ';
    links += '<a href="' + escAttr(gmapsUrl) + '" target="_blank" rel="noopener">Google Maps</a>';
    html += '<div class="popup-website">' + links + '</div>';
    return html;
  }

  function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function linkify(s) {
    var escaped = escHtml(s);
    return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  map.on('load', function() {
    parseHash();

    map.getStyle().layers.forEach(function(layer) {
      if (layer.type === 'symbol' && /poi/i.test(layer.id)) {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }
    });

    map.addSource('spots', { type: 'geojson', data: featureCollection(ENTRIES) });

    map.addLayer({
      id: 'spots-icons',
      type: 'symbol',
      source: 'spots',
      layout: {
        'icon-image': ['get', 'icon'],
        'icon-size': 1.2,
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
        'text-size': 12,
        'text-offset': [0, 1.1],
        'text-anchor': 'top',
        'text-optional': true,
        'text-padding': 2
      },
      paint: {
        'text-color': '#222',
        'text-halo-color': 'rgba(255,255,255,0.9)',
        'text-halo-width': 1.5,
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          12, 0,
          13, 1
        ]
      }
    });

    applyFilters();
    updateResetBtn();

    map.fitBounds(
      [[INITIAL_BOUNDS[0], INITIAL_BOUNDS[1]], [INITIAL_BOUNDS[2], INITIAL_BOUNDS[3]]],
      { padding: 50, maxZoom: 14, animate: false }
    );

    map.on('click', 'spots-icons', function(e) {
      var props = e.features[0].properties;
      var coords = e.features[0].geometry.coordinates.slice();
      while (Math.abs(e.lngLat.lng - coords[0]) > 180) {
        coords[0] += e.lngLat.lng > coords[0] ? 360 : -360;
      }
      new mapboxgl.Popup({ offset: 15 })
        .setLngLat(coords)
        .setHTML(makePopupHTML(props))
        .addTo(map);
    });

    map.on('mouseenter', 'spots-icons', function() { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'spots-icons', function() { map.getCanvas().style.cursor = ''; });
  });
})();
</script>
</body>
</html>
